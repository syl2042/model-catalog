[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-model-catalog"
version = "1.0.0"
description = "A validated, provenance-aware AI model catalog"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "jsonschema>=4.22,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aurora-model-catalog = "aurora_model_catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional real network integration"]
